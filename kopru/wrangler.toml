name = "gloxorg-ai"
main = "gloxorg-ai.js"
compatibility_date = "2026-01-01"
workers_dev = true

# Cloudflare Workers AI — sesi metne çevirme (Whisper). Ek hesap/anahtar YOK; Cloudflare hesabıyla çalışır.
[ai]
binding = "AI"

# LiveKit (kendi canlı görüşme sunucumuz) ayarları.
# API Key ve URL gizli DEĞİL (her bilette görünür) → burada durabilir.
# ⛔ API SECRET buraya YAZILMAZ → o "secret" olarak eklenir:  wrangler secret put LIVEKIT_API_SECRET
# (veya Cloudflare panosu → Worker → Settings → Variables and Secrets → Add → Type: Secret).
[vars]
LIVEKIT_API_KEY = "APIyVSD9mLtAPMv"
LIVEKIT_URL = "wss://canli.gloxorg.com"
