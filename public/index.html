<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget=resizes-content: KLAVYE acilinca sayfa/pencere KUCULUR (klavyenin altina sigar).
         Boylece sohbet (GLOME) yazi kutusu klavyenin ALTINDA KALMAZ, ne yazdigin gorunur. Tam ekran TWA da
         bazi telefonlarda klavye ekrani kucultmuyordu; bu ayar standart cozum, calisan pencereleri bozmaz. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Durum çubuğu (üstte saat/bildirim alanı) rengi = YUMUŞAK ALTIN TOZU (#ecd9a0), siyah/koyu DEĞİL, parlak sarı da DEĞİL.
         Kullanıcı: "siyah şerit istemem, daha önceki gibi altın olsun ama parlak olmasın, altın tozu gibi". Açık zeminde OS saat/pil
         ikonlarını KOYU gösterir → okunur. NOT: bu renk YENİ PAKET (.aab) üretilince kurulu uygulamada görünür (eski paket değişmez). -->
    <meta name="theme-color" content="#ecd9a0" />
    <script>
      /* SAYFA DİLİNİ ZİYARETÇİNİN TARAYICI DİLİNE HEMEN AYARLA (React'ten ÖNCE).
         Sabit lang yüzünden tarayıcı "bu sayfa yabancı dilde, çevrilsin mi?" bandını gösteriyordu
         (müşteriye Türkçe çevir diyordu). Artık her müşteri sayfayı KENDİ telefon diliyle açar; bant çıkmaz. */
      try { var _l = (navigator.language || navigator.userLanguage || 'en').split('-')[0]; if (_l) document.documentElement.lang = _l; } catch (e) {}
    </script>
    <!-- Hafif önbellek: revalidate eder (yeni sürüm gelir) ama "no-store" YOK.
         Böylece sayfa arka plandan/geri gelince YENİDEN YÜKLENMEZ (bfcache çalışır).
         Sürüm tazeliği zaten hash'li dosya isimleriyle sağlanıyor. -->
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="GLOXORG - dünyanın en lüks meslek platformu" />
    <!-- Ana ekran ikonu (iPhone "Ana Ekrana Ekle" bunu kullanır) — GLOXORG altın elmas -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192-b213.png" />
    <link rel="icon" href="%PUBLIC_URL%/logo192-b213.png" />
    <!-- PWA / Play Store: uygulama ayar dosyası (manifest) bağlantısı — bu OLMADAN tarayıcı/PWABuilder manifesti BULAMAZ
         (uygulama "yüklenebilir" sayılmaz, Android paketi üretilemez). Altın açılış rengi + logolar buradan okunur. -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GLOXORG" />
    <!-- SADECE amblem düzenleyicinin yazı tipleri yüklenir. DİKKAT: Cinzel/Cormorant YÜKLENMEZ —
         site rakamları (sayaç, şerit, çipler) Cinzel kullanıyor; Cinzel yüklenince rakamlar eğri/bozuk
         çıkıyordu (B231 hatası). Yüklenmeyince eski DÜZGÜN serif yedeğine döner. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- AÇILIŞ HIZI: veri sunucularına BAŞTAN bağlan (bağlantı kurulumu önden hazır olsun → gönderiler/resimler daha çabuk gelir).
         Bunlar SADECE tarayıcı ipucu — koda/akışa/tasarıma DOKUNMAZ, bir şeyi bozamaz. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://gloxorg-ai.abdulkadirciftsuren.workers.dev" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="dns-prefetch" href="https://securetoken.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Montserrat:wght@600;800&family=Oswald:wght@500;700&family=Bebas+Neue&family=Anton&family=Lobster&family=Pacifico&family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Righteous&display=swap" rel="stylesheet" />
    <title>GLOXORG</title>
    <style>
      /* Sayfa parmakla zoomlanmaz, fotograflar serbest.
         ⛔ EN ALT ZEMİN ALTIN (kullanıcı: hiçbir yerde koyu/mavi istemiyorum). ÖNEMLİ: bu en arka katman,
         telefon kaydırırken sayfanın boş bıraktığı yeri BİR AN bunu gösterir; koyu olunca "parlama/parça parça"
         gibi görünüyordu. Altın olunca boşluk da altın → parlama/kesilme göze batmaz. */
      /* ⛔ "ÇEKİNCE YENİLE" (pull-to-refresh) KAPALI (B261): Android'de sayfa en yukarıdayken parmakla aşağı çekip
         bırakınca tarayıcı sayfayı KOMPLE yeniden yüklüyordu = tam parlama/beyazlama + "her seferinde güncelleniyor"
         hissi (kullanıcı: "aşağıdan yukarı aldığımda gene yeniden yükleme yapıyor"). overscroll-behavior:none bunu
         KAPATIR (Facebook/TikTok gibi). Sayfa içi kaydırma normal çalışır; sadece en üstte çekince yenileme olmaz. */
      html, body, #root { touch-action: pan-x pan-y; overscroll-behavior:none; }
      html, body { background:radial-gradient(ellipse at 50% 22%, #fbf0c9 0%, #f2df9f 42%, #e8c86a 72%, #d9b84a 100%); }
      /* #root ŞEFFAF → içerik BOŞ/henüz gelmediğinde ALTTAKİ markalı yükleme ekranı (#gw-arka) görünür;
         içerik (Giriş/Anasayfa — hepsi kendi opak zeminli) gelince onu ÖRTER. */
      #root { background:transparent; position:relative; z-index:1; }
      img { touch-action: auto; }
      /* ===== MARKALI YÜKLEME EKRANI (#gw-arka) — "sarı perde" artık bomboş değil, GLOXORG logosu + dönen halka.
         En arkada (z-index:-1) durur; #root boşken görünür, içerik gelince ÖRTÜLÜR. Sadece CSS/HTML → JS gerektirmez,
         asla "takılı" kalmaz. Arka plandan dönüşte/yavaş açılışta bomboş sarı yerine düzgün bir yükleme ekranı gösterir. */
      #gw-arka{ position:fixed; inset:0; z-index:-1; display:flex; align-items:center; justify-content:center; pointer-events:none;
        background:radial-gradient(ellipse at 50% 22%, #fbf0c9 0%, #f2df9f 42%, #e8c86a 72%, #d9b84a 100%); }
      #gw-arka .gw-arka-ic{ display:flex; flex-direction:column; align-items:center; gap:16px; }
      #gw-arka .gw-arka-logo{ width:94px; height:94px; border-radius:20px; box-shadow:0 10px 30px rgba(120,90,0,.28); }
      #gw-arka .gw-arka-ad{ font-family:Georgia,'Times New Roman',serif; font-weight:800; font-size:26px; letter-spacing:.16em; color:#6a4e00; }
      #gw-arka .gw-arka-halka{ width:40px; height:40px; border-radius:50%; border:4px solid rgba(120,90,0,.2); border-top-color:#8a6a00; animation:gwDon .85s linear infinite; }
      /* SOSYAL GİRİŞ YÜKLEME EKRANI — index.html'de (React'ten ÖNCE de görünür).
         Google/sosyal girişte sayfa bir an yeniden yüklenince BEYAZ flash olmasın diye,
         baştan sona TEK koyu ekran kalır. SADECE sosyal giriş bayrağı varsa gösterilir. */
      /* ALTIN zemin — sayfa zemini ile aynı, sıçrama olmasın. Yazı SABİT (yanıp sönme yok). */
      #gw-yuk{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;
        background:radial-gradient(ellipse at 50% 22%, #fbf0c9 0%, #f2df9f 42%, #e8c86a 72%, #d9b84a 100%);}
      #gw-yuk .gw-k{display:flex;flex-direction:column;align-items:center;gap:22px;}
      #gw-yuk .gw-h{width:54px;height:54px;border-radius:50%;
        border:3px solid rgba(90,63,0,.22);border-top-color:#7a5a00;border-right-color:#b58a1e;
        animation:gwDon .8s linear infinite;}
      @keyframes gwDon{to{transform:rotate(360deg);}}
      #gw-yuk .gw-m{font-family:Georgia,'Times New Roman',serif;color:#5a3f00;font-size:17px;font-weight:700;
        letter-spacing:.04em;text-align:center;max-width:80vw;}
      /* ===== ÜST/ALT CAM-ALTIN TOZU ŞERİT =====
         VARSAYILAN: GİZLİ (normal tarayıcı sekmesinde hiç görünmez → hiçbir şeyi bozmaz). */
      .gw-cam-serit{ display:none; }
      /* SADECE kurulu uygulama modunda (TWA tam ekran / PWA) görünür. */
      @media (display-mode: fullscreen), (display-mode: standalone), (display-mode: minimal-ui){
        /* backdrop-filter (blur) KALDIRILDI (B260): kullanıcının Android tarayıcısı bu blur'u SİYAH render ediyordu
           (B251'de tam ekran göstericide de aynı sorun çıkmıştı) → altta "şeffaf siyah/cam şerit" görünüyordu; ayrıca
           blur her kaydırma/yenilemede yeniden hesaplandığı için video kapanınca kalan 1-2 parlamaya da katkısı vardı.
           Blur gitti; şerit ARTIK OPAK ALTIN zemin + altın tozu gradyanı (aşağıda) ile GARANTİLİ altın, ASLA siyah. */
        .gw-cam-serit{
          display:block; position:fixed; left:0; right:0; z-index:1400; pointer-events:none;
          background-color:#f2df9f; /* OPAK altın taban → arkadaki koyu webview ASLA sızmaz */
        }
        /* ÜST şerit — telefon durum çubuğu bölgesi (çentik/kamera). Yüksekliği güvenli-alan kadar;
           çubuk gizliyken 0 → görünmez (tam ekran), göründüğünde cam-altın tozu belirir. */
        .gw-cam-ust{
          top:0; height:env(safe-area-inset-top, 0px);
          background:
            radial-gradient(circle at 22% 62%, rgba(255,246,207,.85) 0, rgba(255,220,120,.42) 32%, rgba(255,205,70,0) 60%),
            radial-gradient(circle at 41% 34%, rgba(255,248,214,.72) 0, rgba(255,205,70,0) 50%),
            radial-gradient(circle at 60% 64%, rgba(255,240,180,.60) 0, rgba(255,205,70,0) 52%),
            radial-gradient(circle at 79% 40%, rgba(255,246,207,.70) 0, rgba(255,205,70,0) 48%),
            linear-gradient(180deg, rgba(255,216,120,.46), rgba(238,186,80,.26));
          background-color:#f2df9f; /* OPAK altın taban (gradyanların ALTINDA) → siyah sızmaz */
          box-shadow:0 1px 12px rgba(255,205,90,.22), inset 0 -1px 0 rgba(255,232,155,.55);
        }
        /* ALT şerit — telefon gezinme (Android) tuşları bölgesi. */
        .gw-cam-alt{
          bottom:0; height:env(safe-area-inset-bottom, 0px);
          background:
            radial-gradient(circle at 26% 40%, rgba(255,246,207,.85) 0, rgba(255,220,120,.42) 32%, rgba(255,205,70,0) 60%),
            radial-gradient(circle at 45% 66%, rgba(255,248,214,.72) 0, rgba(255,205,70,0) 50%),
            radial-gradient(circle at 63% 38%, rgba(255,240,180,.60) 0, rgba(255,205,70,0) 52%),
            radial-gradient(circle at 80% 62%, rgba(255,246,207,.70) 0, rgba(255,205,70,0) 48%),
            linear-gradient(0deg, rgba(255,216,120,.48), rgba(238,186,80,.26));
          background-color:#f2df9f; /* OPAK altın taban (gradyanların ALTINDA) → siyah sızmaz */
          box-shadow:0 -1px 12px rgba(255,205,90,.22), inset 0 1px 0 rgba(255,232,155,.58);
        }
      }
    </style>
  </head>
  <body>
    <noscript>Bu uygulamayı çalıştırmak için JavaScript gerekli.</noscript>
    <!-- Sosyal giriş yükleme ekranı (varsayılan gizli) -->
    <div id="gw-yuk"><div class="gw-k"><div class="gw-h"></div><div class="gw-m" id="gw-yuk-m"></div></div></div>
    <!-- TAKILDI EKRANI (B397): Uygulama açılırken içerik (#root) uzun süre BOŞ kalırsa (sabit sarı perde) burası
         görünür → kullanıcı TEK DOKUNUŞLA yeniler (kapat-aç gerekmez). Ayrıca küçük SAYAÇ sürekli artar = JS çalışıyor
         demek (teşhis: bu ekran+artan sayaç görünüyorsa sorun web tarafında çözülebilir; bu ekran HİÇ çıkmıyorsa JS donmuş
         = telefon uygulamayı öldürmüş, o zaman farklı bakarız). Zemin ALTIN (siyah yok). -->
    <div id="gw-takildi" style="display:none;position:fixed;inset:0;z-index:100000;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:radial-gradient(ellipse at 50% 22%, #fbf0c9 0%, #f2df9f 42%, #e8c86a 72%, #d9b84a 100%);font-family:Georgia,'Times New Roman',serif;color:#5a3f00;">
      <div style="font-size:40px">💎</div>
      <div style="font-size:17px;font-weight:700;max-width:300px;line-height:1.45">Açılış biraz uzun sürdü.<br>Yenilemek için dokun.</div>
      <button id="gw-takildi-btn" type="button" style="border:none;border-radius:14px;padding:14px 30px;font-size:16px;font-weight:900;cursor:pointer;background:linear-gradient(180deg,#fff7d6,#ffd700 60%,#c79a17);color:#3a2a00;box-shadow:0 6px 18px rgba(120,90,0,.4)">Yeniden Yükle</button>
      <div id="gw-takildi-bilgi" style="font-size:11px;opacity:.65;font-family:monospace"></div>
    </div>
    <!-- MARKALI YÜKLEME EKRANI — en arkada; #root boşken (açılış/arka plandan dönüş) GLOXORG logosu+halka görünür, içerik gelince örtülür -->
    <div id="gw-arka" aria-hidden="true">
      <div class="gw-arka-ic">
        <img class="gw-arka-logo" src="%PUBLIC_URL%/logo192-b213.png" alt="" />
        <div class="gw-arka-ad notranslate" translate="no">GLOXORG</div>
        <div class="gw-arka-halka"></div>
      </div>
    </div>
    <div id="root"></div>
    <!-- ALT CAM-ALTIN ŞERİT (SADECE kurulu uygulama modunda görünür; normal tarayıcıda gizli).
         Telefonun ALT tuş çubuğu bölgesini (güvenli-alan) şeffaf cam + hafif altın tozuyla kaplar.
         pointer-events:none → dokunmayı ASLA engellemez. z-index:1400 → hikâye/reels/medya pencereleri (1500+) ÜSTÜNE biner.
         NOT (B217): ÜST şerit (.gw-cam-ust) KALDIRILDI — kullanıcı "para değerler şeridinin üstünde sarı şeffaf bir perde
         kalıyor, kaldır" dedi. Üst durum çubuğu rengi zaten theme-color (#ecd9a0 altın) ile veriliyor; ekstra üst şerit
         gereksizdi ve şeridin üstüne biniyordu. Siyah OLMAZ (üst OS durum çubuğu altın kalır). -->
    <div class="gw-cam-serit gw-cam-alt"></div>
    <script>
      /* Sosyal giriş sürerken (bayrak varsa) yükleme ekranını HEMEN göster —
         sayfa yeniden yüklense bile beyaz flash görünmez. React hazır olunca gizler. */
      try {
        var gwMsg = sessionStorage.getItem('gwYukMetin');
        if (gwMsg) {
          var gwM = document.getElementById('gw-yuk-m');
          if (gwM) gwM.textContent = gwMsg;
          document.getElementById('gw-yuk').style.display = 'flex';
        }
      } catch (e) {}
    </script>
    <script>
      /* ===== ARKA PLANDAN DÖNÜŞ KURTARMASI (SABİT SARI PERDE) =====
         KULLANICI (kronik, en büyük şikâyet): "Uygulama arka planda UZUN kalınca, geri açtığımda SABİT sarı perde
         çıkıyor, kendi açılmıyor, kapat-aç yapmam lazım. İnternet hep açık (5G)."
         SEBEP: Android/WebView uygulamayı arka planda dondurunca, geri gelince sayfanın İÇERİĞİ (#root) BOŞ kalıyor
         (altındaki altın zemin görünüyor = sarı perde) ve KENDİNİ TOPARLAMIYOR. index.js'teki _kurtar SADECE dosya
         hatası/çökme olunca çalışır; bu durumda hata/çökme YOK, o yüzden devreye girmiyordu — işte o boşluk burada kapanıyor.
         ÇÖZÜM: sayfa TEKRAR GÖRÜNÜR olunca (arka plandan dönüş / bfcache), kısa bir süre sonra #root HÂLÂ BOŞ ise (takıldı)
         sayfayı TEK SEFER temiz yeniden yükle → React yeniden kurulur, sarı perde gider (kapat-aç ile aynı etki, ama otomatik).
         GÜVENLİK: İçerik doluysa (normal) HİÇBİR ŞEY yapmaz → hızlı dönüş (bfcache) korunur, gereksiz yenileme OLMAZ.
         DÖNGÜ KORUMASI: 60 sn'de en fazla 1 otomatik yenile. Soğuk açılışta (ilk açılış) ÇALIŞMAZ (sadece dönüşte). */
      (function () {
        var gizliZaman = 0;
        function iceriDolu() {
          try { var r = document.getElementById('root'); return !!(r && r.childElementCount > 0); } catch (e) { return true; }
        }
        function kurtarmayiDene() {
          setTimeout(function () {
            try {
              if (document.hidden) return;          // tekrar arka plana geçtiyse karışma
              if (iceriDolu()) return;              // içerik GELDİ → sorun yok, dokunma (hızlı dönüş korunur)
              var son = 0; try { son = parseInt(sessionStorage.getItem('gwDonusKurtar') || '0', 10); } catch (e) {}
              if (Date.now() - son < 60000) return; // 60 sn içinde zaten denedik → sonsuz döngü YOK
              try { sessionStorage.setItem('gwDonusKurtar', String(Date.now())); } catch (e) {}
              window.location.reload();             // takıldı → temiz yeniden yükle (React yeniden kurulur)
            } catch (e) {}
          }, 1800); // 1.8 sn izin ver (yavaş telefonda kendine gelebilir); hâlâ boşsa yenile
        }
        try {
          document.addEventListener('visibilitychange', function () {
            if (document.hidden) { gizliZaman = Date.now(); return; }
            // Görünür olduk. Yalnızca GERÇEKTEN arka planda kaldıysa (>15 sn) kurtarmayı düşün (kısa geçişlerde değil).
            if (gizliZaman && (Date.now() - gizliZaman > 15000)) kurtarmayiDene();
          });
          // bfcache'ten (geri/ileri ya da arka plandan) geri dönüş
          window.addEventListener('pageshow', function (e) { if (e && e.persisted) kurtarmayiDene(); });
        } catch (e) {}
      })();
    </script>
    <script>
      /* ===== AÇILIŞTA TAKILMA — OTOMATİK KURTARMA + TEŞHİS (B415) =====
         Sayfa açılırken içerik (#root) 9 sn içinde HÂLÂ BOŞ ise (sabit sarı perde): JS çalışıyor ama bir şey takıldı /
         dosya inmedi demektir → TEK SEFER kendiliğinden TEMİZ yeniden yükle (kapat-aç gerekmez, kullanıcı düğmeye basmasın).
         Yenileme de düzeltmezse (hâlâ boş) "Yeniden Yükle" düğmesini + artan sayacı göster (teşhis: sayaç artıyorsa JS çalışıyor).
         İçerik gelince ekran kendiliğinden kaybolur. Normal/yavaş açılışta (içerik gelince) HİÇBİR ŞEY görünmez.
         ⚠️ SINIR: Bu ancak sayfanın JS'i ÇALIŞIYORSA işe yarar. Telefon uygulamayı arka planda tamamen ÖLDÜRDÜYSE
         (renderer kill — agresif pil yönetimi), bu kod da çalışamaz → o durumda telefon ayarından uygulamayı
         "uyutma/pil kısıtlaması" KAPATILMALI (veya yeni uygulama paketi gerekir). */
      (function () {
        function bosMu() { try { var r = document.getElementById('root'); return !(r && r.childElementCount > 0); } catch (e) { return false; } }
        var OTO = 'gwAcilisOto';
        setTimeout(function () {
          try {
            if (!bosMu()) return;                 // içerik geldi → sorun yok (dokunma)
            var son = 0; try { son = parseInt(sessionStorage.getItem(OTO) || '0', 10); } catch (e) {}
            if (Date.now() - son > 45000) {        // 45 sn'de EN FAZLA 1 otomatik yenile → sonsuz döngü YOK
              try { sessionStorage.setItem(OTO, String(Date.now())); } catch (e) {}
              try { window.location.reload(); } catch (e) {} // takıldı → TEK SEFER kendiliğinden temiz yenile
              return;
            }
            // Yakın zamanda zaten otomatik yeniledik ve HÂLÂ boş → kullanıcıya düğme + sayaç göster
            var ekran = document.getElementById('gw-takildi'); if (ekran) ekran.style.display = 'flex';
            var bilgi = document.getElementById('gw-takildi-bilgi'); var sn = 0;
            var t = setInterval(function () {
              sn++;
              if (bilgi) bilgi.textContent = 'A13B415 • ' + sn + ' sn';
              if (!bosMu()) { try { if (ekran) ekran.style.display = 'none'; } catch (e) {} clearInterval(t); } // içerik geldi → gizle
            }, 1000);
            var btn = document.getElementById('gw-takildi-btn');
            if (btn) btn.onclick = function () {
              try { sessionStorage.removeItem('gloxSonKurtarma'); sessionStorage.removeItem('gwDonusKurtar'); sessionStorage.removeItem(OTO); } catch (e) {}
              try { window.location.reload(); } catch (e) {}
            };
          } catch (e) {}
        }, 9000); // 9 sn içinde içerik yoksa: önce 1 kez otomatik yenile, olmazsa düğme
      })();
    </script>
