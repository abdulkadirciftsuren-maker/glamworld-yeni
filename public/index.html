<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- Durum çubuğu (üstte saat/bildirim alanı) rengi = uygulamanın SICAK KREM zemini (#f4ecda), koyu lacivert DEĞİL.
         Kullanıcı: "yukarda siyah şerit var, tam ekrana girmiyor sadece kararıyor" → artık durum çubuğu uygulamayla kaynaşır (siyah değil).
         Açık zeminde OS saat/pil ikonlarını KOYU gösterir → okunur. (Anayasa: hiçbir yerde siyah/koyu zemin.) -->
    <meta name="theme-color" content="#f4ecda" />
    <script>
      /* SAYFA DİLİNİ ZİYARETÇİNİN TARAYICI DİLİNE HEMEN AYARLA (React'ten ÖNCE).
         Sabit lang yüzünden tarayıcı "bu sayfa yabancı dilde, çevrilsin mi?" bandını gösteriyordu
         (müşteriye Türkçe çevir diyordu). Artık her müşteri sayfayı KENDİ telefon diliyle açar; bant çıkmaz. */
      try { var _l = (navigator.language || navigator.userLanguage || 'en').split('-')[0]; if (_l) document.documentElement.lang = _l; } catch (e) {}
    </script>
    <!-- Hafif önbellek: revalidate eder (yeni sürüm gelir) ama "no-store" YOK.
         Böylece sayfa arka plandan/geri gelince YENİDEN YÜKLENMEZ (bfcache çalışır).
         Sürüm tazeliği zaten hash'li dosya isimleriyle sağlanıyor. -->
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="GLOXORG - dünyanın en lüks meslek platformu" />
    <!-- Ana ekran ikonu (iPhone "Ana Ekrana Ekle" bunu kullanır) — GLOXORG altın elmas -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192-b207.png" />
    <link rel="icon" href="%PUBLIC_URL%/logo192-b207.png" />
    <!-- PWA / Play Store: uygulama ayar dosyası (manifest) bağlantısı — bu OLMADAN tarayıcı/PWABuilder manifesti BULAMAZ
         (uygulama "yüklenebilir" sayılmaz, Android paketi üretilemez). Altın açılış rengi + logolar buradan okunur. -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GLOXORG" />
    <!-- SADECE amblem düzenleyicinin yazı tipleri yüklenir. DİKKAT: Cinzel/Cormorant YÜKLENMEZ —
         site rakamları (sayaç, şerit, çipler) Cinzel kullanıyor; Cinzel yüklenince rakamlar eğri/bozuk
         çıkıyordu (B231 hatası). Yüklenmeyince eski DÜZGÜN serif yedeğine döner. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- AÇILIŞ HIZI: veri sunucularına BAŞTAN bağlan (bağlantı kurulumu önden hazır olsun → gönderiler/resimler daha çabuk gelir).
         Bunlar SADECE tarayıcı ipucu — koda/akışa/tasarıma DOKUNMAZ, bir şeyi bozamaz. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://gloxorg-ai.abdulkadirciftsuren.workers.dev" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="dns-prefetch" href="https://securetoken.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Montserrat:wght@600;800&family=Oswald:wght@500;700&family=Bebas+Neue&family=Anton&family=Lobster&family=Pacifico&family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Righteous&display=swap" rel="stylesheet" />
    <title>GLOXORG</title>
    <style>
      /* Sayfa parmakla zoomlanmaz, fotograflar serbest.
         İLK ZEMİN AÇIK GECE MAVİSİ (derin) — kullanıcı seçti; ortası aydınlık kenarı derin, düz boya değil. */
      html, body, #root { touch-action: pan-x pan-y; background:radial-gradient(ellipse at 50% 22%, #3d63a0 0%, #294a7d 42%, #1a3560 72%, #142b4f 100%); }
      img { touch-action: auto; }
      /* SOSYAL GİRİŞ YÜKLEME EKRANI — index.html'de (React'ten ÖNCE de görünür).
         Google/sosyal girişte sayfa bir an yeniden yüklenince BEYAZ flash olmasın diye,
         baştan sona TEK koyu ekran kalır. SADECE sosyal giriş bayrağı varsa gösterilir. */
      /* AÇIK GECE MAVİSİ (derin) — sayfa zemini ile aynı, sıçrama olmasın. Yazı SABİT (yanıp sönme yok). */
      #gw-yuk{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;
        background:radial-gradient(ellipse at 50% 22%, #3d63a0 0%, #294a7d 42%, #1a3560 72%, #142b4f 100%);}
      #gw-yuk .gw-k{display:flex;flex-direction:column;align-items:center;gap:22px;}
      #gw-yuk .gw-h{width:54px;height:54px;border-radius:50%;
        border:3px solid rgba(255,233,168,.28);border-top-color:#ffd700;border-right-color:#ffe9a8;
        animation:gwDon .8s linear infinite;}
      @keyframes gwDon{to{transform:rotate(360deg);}}
      #gw-yuk .gw-m{font-family:Georgia,'Times New Roman',serif;color:#cfe0ff;font-size:17px;font-weight:700;
        letter-spacing:.04em;text-align:center;max-width:80vw;}
      /* ===== ÜST/ALT CAM-ALTIN TOZU ŞERİT =====
         VARSAYILAN: GİZLİ (normal tarayıcı sekmesinde hiç görünmez → hiçbir şeyi bozmaz). */
      .gw-cam-serit{ display:none; }
      /* SADECE kurulu uygulama modunda (TWA tam ekran / PWA) görünür. */
      @media (display-mode: fullscreen), (display-mode: standalone), (display-mode: minimal-ui){
        .gw-cam-serit{
          display:block; position:fixed; left:0; right:0; z-index:1400; pointer-events:none;
          -webkit-backdrop-filter:blur(11px) saturate(1.35); backdrop-filter:blur(11px) saturate(1.35);
        }
        /* ÜST şerit — telefon durum çubuğu bölgesi (çentik/kamera). Yüksekliği güvenli-alan kadar;
           çubuk gizliyken 0 → görünmez (tam ekran), göründüğünde cam-altın tozu belirir. */
        .gw-cam-ust{
          top:0; height:env(safe-area-inset-top, 0px);
          background:
            radial-gradient(circle at 22% 62%, rgba(255,246,207,.85) 0, rgba(255,220,120,.42) 32%, rgba(255,205,70,0) 60%),
            radial-gradient(circle at 41% 34%, rgba(255,248,214,.72) 0, rgba(255,205,70,0) 50%),
            radial-gradient(circle at 60% 64%, rgba(255,240,180,.60) 0, rgba(255,205,70,0) 52%),
            radial-gradient(circle at 79% 40%, rgba(255,246,207,.70) 0, rgba(255,205,70,0) 48%),
            linear-gradient(180deg, rgba(255,216,120,.46), rgba(238,186,80,.26));
          box-shadow:0 1px 12px rgba(255,205,90,.22), inset 0 -1px 0 rgba(255,232,155,.55);
        }
        /* ALT şerit — telefon gezinme (Android) tuşları bölgesi. */
        .gw-cam-alt{
          bottom:0; height:env(safe-area-inset-bottom, 0px);
          background:
            radial-gradient(circle at 26% 40%, rgba(255,246,207,.85) 0, rgba(255,220,120,.42) 32%, rgba(255,205,70,0) 60%),
            radial-gradient(circle at 45% 66%, rgba(255,248,214,.72) 0, rgba(255,205,70,0) 50%),
            radial-gradient(circle at 63% 38%, rgba(255,240,180,.60) 0, rgba(255,205,70,0) 52%),
            radial-gradient(circle at 80% 62%, rgba(255,246,207,.70) 0, rgba(255,205,70,0) 48%),
            linear-gradient(0deg, rgba(255,216,120,.48), rgba(238,186,80,.26));
          box-shadow:0 -1px 12px rgba(255,205,90,.22), inset 0 1px 0 rgba(255,232,155,.58);
        }
      }
    </style>
  </head>
  <body>
    <noscript>Bu uygulamayı çalıştırmak için JavaScript gerekli.</noscript>
    <!-- Sosyal giriş yükleme ekranı (varsayılan gizli) -->
    <div id="gw-yuk"><div class="gw-k"><div class="gw-h"></div><div class="gw-m" id="gw-yuk-m"></div></div></div>
    <div id="root"></div>
    <!-- ÜST & ALT CAM-ALTIN ŞERİT (SADECE kurulu uygulama modunda görünür; normal tarayıcıda gizli).
         Telefonun durum/tuş çubuğu bölgesini (güvenli-alan) şeffaf cam + hafif altın tozuyla kaplar.
         pointer-events:none → dokunmayı ASLA engellemez. z-index:1400 → hikâye/reels/medya pencereleri (1500+) ÜSTÜNE biner (tam ekran medyada altın çıkmaz). -->
    <div class="gw-cam-serit gw-cam-ust"></div>
    <div class="gw-cam-serit gw-cam-alt"></div>
    <script>
      /* Sosyal giriş sürerken (bayrak varsa) yükleme ekranını HEMEN göster —
         sayfa yeniden yüklense bile beyaz flash görünmez. React hazır olunca gizler. */
      try {
        var gwMsg = sessionStorage.getItem('gwYukMetin');
        if (gwMsg) {
          var gwM = document.getElementById('gw-yuk-m');
          if (gwM) gwM.textContent = gwMsg;
          document.getElementById('gw-yuk').style.display = 'flex';
        }
      } catch (e) {}
    </script>
  </body>
</html>
