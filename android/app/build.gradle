plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.gloxorg.app'
    compileSdk 35

    defaultConfig {
        // ÜRETİM paketi — yeni temiz uygulama (eski com.gloxorg.twa'dan AYRI)
        applicationId 'com.gloxorg.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // İMZA: anahtar bilgileri ortam değişkenlerinden okunur (CI'da üretilir/secret'tan gelir).
    // Yoksa (yerel/denemede) release imzasız kalmasın diye debug imzasına düşer.
    signingConfigs {
        release {
            def storeF = System.getenv('GLOX_STORE_FILE')
            if (storeF != null && !storeF.isEmpty()) {
                storeFile file(storeF)
                storePassword System.getenv('GLOX_STORE_PASSWORD')
                keyAlias System.getenv('GLOX_KEY_ALIAS')
                keyPassword System.getenv('GLOX_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def storeF = System.getenv('GLOX_STORE_FILE')
            if (storeF != null && !storeF.isEmpty()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Telefonda kayıtlı Google hesabıyla tek dokunuş giriş ("... olarak devam et") — Facebook/Instagram gibi
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    // Bildirimler (uygulama kapalıyken mesaj/beğeni/arama) — Firebase Cloud Messaging
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
}
