plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.gloxorg.webtest'
    compileSdk 34

    defaultConfig {
        // DENEME paketi — canlı uygulamadan AYRI (com.gloxorg.twa'ya dokunmaz, yan yana kurulur)
        applicationId 'com.gloxorg.webtest'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0-test'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Sade: AndroidX yok, sadece çerçeve WebView + Kotlin stdlib (eklenti ile gelir)
}
