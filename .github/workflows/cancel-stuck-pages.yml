name: cancel-stuck-pages
on:
  workflow_dispatch: {}
permissions:
  pages: write
  id-token: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck Pages deployment
        run: |
          echo "Cancelling stuck deployment 102de959..."
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/deployments/102de959f5ba5c76336e0171fd1366f5603142f0/cancel" \
            -w "\nHTTP_STATUS %{http_code}\n"
