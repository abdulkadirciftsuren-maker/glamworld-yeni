# GLOXORG — Google girisi "ilk dokunusta acilsin" icin AYNI-ADRES (same-origin) auth kurulumu. (calistirma 1)
# Bu is akisi, kullanicinin GitHub'a ekledigi FIREBASE_SA anahtariyla (hizmet hesabi) Firebase Hosting'e
# kucuk bir "giris kapisi" sitesi yayinlar. Boylece Firebase konsolunda Hosting panosu acilir ve
# auth.gloxorg.com ozel alan adi baglanabilir. (Asil uygulama gloxorg.com'da, gh-pages'te kalir.)
name: GLOXORG auth hosting kurulum
on:
  push:
    branches: ["claude/glamworld-rules-review-0kzl0x"]
    paths:
      - ".github/workflows/firebase-hosting-auth.yml"
      - "authgate/**"
      - "firebase.authgate.json"
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: firebase-tools kur
        run: npm install -g firebase-tools@13.29.1
      - name: Hizmet hesabi anahtarini yaz
        env:
          SA: ${{ secrets.FIREBASE_SA }}
        run: |
          if [ -z "$SA" ]; then
            echo "HATA: FIREBASE_SA secret bulunamadi. Once GitHub'a secret eklenmeli."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "Anahtar dosyasi yazildi."
      - name: Hangi yetkiler var (teshis)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          echo "=== Firebase projeleri ==="
          firebase projects:list --project glamworld2 || true
          echo "=== Hosting siteleri ==="
          firebase hosting:sites:list --project glamworld2 || true
      - name: Auth giris kapisi sitesini yayinla
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          firebase deploy --only hosting --config firebase.authgate.json --project glamworld2 --non-interactive
      - name: Bitti
        run: |
          echo "YAYIN TAMAM."
          echo "Simdi Firebase konsolunda Hosting panosu acildi; auth.gloxorg.com ozel alan adi baglanabilir."
      - name: DNS kontrol (auth.gloxorg.com CNAME dogru mu)
        run: |
          echo "=== auth.gloxorg.com CNAME kontrolu ==="
          nslookup -type=CNAME auth.gloxorg.com 8.8.8.8 || true
          (command -v dig >/dev/null && dig +short CNAME auth.gloxorg.com @8.8.8.8) || true
          echo "NOT: 'glamworld2.web.app' gorunuyorsa CNAME DOGRU."
      - name: Auth yetkili alan adina auth.gloxorg.com ekle
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --project=glamworld2 -q
          TOKEN=$(gcloud auth print-access-token)
          CFG=$(curl -s -H "Authorization: Bearer $TOKEN" "https://identitytoolkit.googleapis.com/admin/v2/projects/glamworld2/config")
          echo "=== Mevcut yetkili alan adlari ==="; echo "$CFG" | jq '.authorizedDomains'
          if echo "$CFG" | jq -e '.authorizedDomains | index("auth.gloxorg.com")' >/dev/null; then
            echo "auth.gloxorg.com ZATEN yetkili alan adlarinda."
          else
            NEW=$(echo "$CFG" | jq -c '.authorizedDomains + ["auth.gloxorg.com"]')
            echo "=== auth.gloxorg.com ekleniyor ==="
            curl -s -X PATCH -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "https://identitytoolkit.googleapis.com/admin/v2/projects/glamworld2/config?updateMask=authorizedDomains" \
              -d "{\"authorizedDomains\": $NEW}" | jq '.authorizedDomains'
          fi
      - name: OAuth redirect URI kabul ediliyor mu (auth.gloxorg.com)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --project=glamworld2 -q
          TOKEN=$(gcloud auth print-access-token)
          CID=$(curl -s -H "Authorization: Bearer $TOKEN" "https://identitytoolkit.googleapis.com/admin/v2/projects/glamworld2/defaultSupportedIdpConfigs/google.com" | jq -r '.clientId')
          echo "Google OAuth client_id (bas kisim): ${CID:0:24}..."
          RU_ENC="https%3A%2F%2Fauth.gloxorg.com%2F__%2Fauth%2Fhandler"
          BODY=$(curl -s "https://accounts.google.com/o/oauth2/v2/auth?client_id=$CID&redirect_uri=$RU_ENC&response_type=code&scope=openid")
          if echo "$BODY" | grep -qi "redirect_uri_mismatch"; then
            echo "SONUC: redirect_uri HENUZ KABUL EDILMIYOR (yayilmamis ya da yanlis). Birkac dk daha bekle."
          else
            echo "SONUC: OK -> redirect_uri KABUL EDILIYOR (mismatch YOK). authDomain cevrilebilir."
          fi
      - name: SSL/handler hazir mi (auth.gloxorg.com)
        run: |
          echo "=== https://auth.gloxorg.com/__/auth/handler durum ==="
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://auth.gloxorg.com/__/auth/handler" || echo "BAGLANTI_YOK")
          echo "HTTP durum: $code"
          echo "NOT: 200 ise SSL hazir ve giris kapisi calisiyor. 000/BAGLANTI_YOK/SSL hatasi ise sertifika henuz hazirlanmamis (bekle)."
