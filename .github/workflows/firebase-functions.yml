# GLOXORG — SUNUCU PROGRAMINI (functions/: bildirimler + kapalıyken arama zili) Firebase'e yükler.
# Eskiden kullanıcı bilgisayardan "firebase deploy --only functions" yapıyordu; artık GitHub'daki FIREBASE_SA
# (hizmet hesabı) anahtarıyla otomatik yüklenir. functions/ değişince ya da elle tetiklenince çalışır.
name: GLOXORG sunucu programi (functions)
# Kullanıcı 5 Kas 2026'da otomatik yüklemeye ONAY verdi ("Evet, otomatik yükle").
on:
  push:
    branches: ["claude/glamworld-rules-review-0kzl0x"]
    paths:
      - "functions/**"
      - ".github/workflows/firebase-functions.yml"
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: firebase-tools kur
        run: npm install -g firebase-tools@13.29.1
      # Firebase aracı, HİÇ eklenti (extension) kullanmasak da her yüklemede eklenti listesine bakıyor; hizmet hesabının
      # buna yetkisi yok → 403. Kontrolü sadece gerçekten eklenti tanımlıysa yapsın (bizde yok).
      - name: Gereksiz eklenti kontrolunu kapat
        run: |
          P="$(npm root -g)/firebase-tools/lib/deploy/functions/prepare.js"
          sed -i 's/\.some((b) => b\.extensions)/.some((b) => b.extensions \&\& Object.keys(b.extensions).length > 0)/' "$P"
          grep -n "Object.keys(b.extensions).length" "$P"
      - name: Sunucu programinin paketlerini kur
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Hizmet hesabi anahtarini yaz
        env:
          SA: ${{ secrets.FIREBASE_SA }}
        run: |
          if [ -z "$SA" ]; then echo "HATA: FIREBASE_SA secret yok"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: Sunucu programini yukle
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          firebase deploy --only functions --project glamworld2 --non-interactive
