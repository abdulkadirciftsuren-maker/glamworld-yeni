name: Android Test APK

# GLOXORG native (WebView) DENEME uygulamasını derler → kurulabilir test APK üretir.
# Web sitesini/yayını ETKİLEMEZ (sadece android/ klasörü). Çıktı: Actions > bu çalışma > Artifacts > gloxorg-test-apk

on:
  push:
    branches: [ claude/glamworld-rules-review-0kzl0x ]
    paths:
      - 'android/**'
      - '.github/workflows/android-test.yml'
  workflow_dispatch:

permissions:
  contents: write   # APK'yı gh-pages'e (siteye) koyabilmek için

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur (kendi paketini kurmasın — eski 'tools' paketi artık yok, patlıyor)
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: SDK bileşenleri (platform 34 + build-tools)
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gradle wrapper üret
        working-directory: android
        run: gradle wrapper --gradle-version 8.9

      - name: Debug APK derle
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: APK'yı yükle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: gloxorg-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: APK'yı siteye koy (gloxorg.com/GLOXORG-test.apk)
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          git config user.name "gloxorg-ci"
          git config user.email "ci@gloxorg.local"
          git fetch origin gh-pages --depth=1
          git worktree add ../ghp gh-pages
          cp "$APK" ../ghp/GLOXORG-test.apk
          cd ../ghp
          git add GLOXORG-test.apk
          git commit -m "deneme APK: GLOXORG-test.apk" || echo "degisiklik yok"
          git push origin gh-pages
